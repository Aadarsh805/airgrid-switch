# AirGrid — the Northgate District drone network. FICTIONAL district, city and agency.
# Drone performance is a simplified model anchored on published DJI Dock 3 figures (54 min max flight,
# 15->95% charge in 27 min, 12 m/s wind limit, 10 km radius). Validated by tools/fleet_check.py.
district:
  name: Northgate District
  size_km: [6.0, 6.0]            # x east, y north; origin = south-west corner
  sectors:                        # weather + grounding is per sector (quadrants split at 3.0, 3.0)
    NW: {x: [0.0, 3.0], y: [3.0, 6.0]}
    NE: {x: [3.0, 6.0], y: [3.0, 6.0]}
    SW: {x: [0.0, 3.0], y: [0.0, 3.0]}
    SE: {x: [3.0, 6.0], y: [0.0, 3.0]}
  junctions:                      # arterial crossings; J9 + Market Street are pinned for DRONE-01
    J1: [0.75, 5.0]
    J2: [2.25, 5.0]
    J3: [3.75, 5.0]
    J4: [5.25, 5.0]
    J5: [0.75, 3.0]
    J6: [2.25, 3.0]
    J7: [3.75, 3.0]
    J8: [5.25, 3.0]
    J9: [0.75, 1.0]
    J10: [2.25, 1.0]
    J11: [3.75, 1.0]
    J12: [5.25, 1.0]
  landmarks:
    market_street: [3.6, 3.0]     # Central Market, on the J7 arterial
    ring_road_j9: [1.5, 1.0]      # Ring Road between J9 and J10
    hospital: [2.1, 4.0]
    old_airfield: [5.8, 3.2]

zones:
  - {id: RED-AIRFIELD, kind: red, rect: {x: [5.6, 6.0], y: [2.2, 4.2]}, rule: "no entry, no override"}
  - {id: NR-HOSPITAL,  kind: no_record, rect: {x: [1.6, 2.6], y: [3.6, 4.4]}, rule: "transit allowed, recording forced off"}
  - {id: VIP-TEMP,     kind: vip, rect: {x: [0.0, 1.2], y: [4.4, 6.0]}, rule: "no entry while active", active: false}

docks:                            # 12 pole docks (1 slot) + 2 rooftop hubs (3 slots) = 18 slots
  P1:  {kind: pole, at: [0.75, 5.0], slots: 1}
  P2:  {kind: pole, at: [2.25, 5.0], slots: 1}
  P3:  {kind: pole, at: [3.75, 5.0], slots: 1}
  P4:  {kind: pole, at: [5.25, 5.0], slots: 1}
  P5:  {kind: pole, at: [0.75, 3.0], slots: 1}
  P6:  {kind: pole, at: [2.25, 3.0], slots: 1}
  P7:  {kind: pole, at: [3.75, 3.0], slots: 1}
  P8:  {kind: pole, at: [5.25, 3.0], slots: 1}
  P9:  {kind: pole, at: [0.75, 1.0], slots: 1}
  P10: {kind: pole, at: [2.25, 1.0], slots: 1}
  P11: {kind: pole, at: [3.75, 1.0], slots: 1}
  P12: {kind: pole, at: [5.25, 1.0], slots: 1}
  HUB-A: {kind: hub, at: [3.0, 4.0], slots: 3}
  HUB-B: {kind: hub, at: [3.0, 2.0], slots: 3}

drone_model:
  max_flight_min: 54
  cruise_km_per_min: 0.9          # 15 m/s
  sprint_km_per_min: 1.2          # 20 m/s
  launch_delay_min: 0.5           # dock lid open + climb
  drain_pct_per_min: {patrol: 1.5, hover: 1.5, cruise: 1.8, track: 2.4, sprint: 3.0}
  charge_pct_per_min: 3.0         # 15->95% in ~27 min
  charge_cap_pct: 100
  reserve_pct: 25                 # hard floor on PROJECTED landing battery
  ready_pct: 80                   # READY = docked and >= 80%
  launch_gate_pct: {patrol: 80, incident: 50, track: 60, perimeter: 50, corridor: 60}
  relief_trigger_pct: 48          # patrol drone at/below this -> relief launches BEFORE it leaves
  track_relief_trigger_pct: 45
  wind_limit_ms: 12
  radius_km: 10

fleet:                            # 14 drones. home = initial dock. Thermal: D-06, D-12.
  D-01: {home: P1}
  D-02: {home: P2}
  D-03: {home: P3}
  D-04: {home: P4}
  D-05: {home: P5}
  D-06: {home: P6, thermal: true}
  D-07: {home: P7}
  D-08: {home: P8}
  D-09: {home: P9}
  D-10: {home: P10}
  D-11: {home: P11}
  D-12: {home: P12, thermal: true}
  D-13: {home: HUB-A}
  D-14: {home: HUB-A}

policies:                         # sim policy parameters (L29); the checker scripts these as golden actions
  auto_launch_triage_min: 0.5     # CAD alert -> auto-launch order (golden: alert 17:12, D-09 launch 17:12:30)
  suspect_view_km: 0.5            # suspect position served only while a tracking drone is within this range
  auto_launch_kinds: [accident, fire, flood]   # cad_alert kinds that auto-launch (robbery etc. need approval)
  thermal_penalty_km: 0.75        # selection penalty keeps thermal drones back for night/track (L21)
  relay_lookahead_min: 3          # relay launches toward the suspect position predicted this far ahead
  relay_handoff_km: 0.15          # relay takes the track within this distance (gap 0 s)
  safety_rtb_margin_pct: 2        # safety RTB when projected landing <= reserve + this
  slot_log_radius_km: 1.6         # skipped DOCK_FULL / DOCK_OFFLINE docks nearer than this are logged
  geofence_km: 0.6                # incident geofence radius: recording only inside it (03 §5, L19)
  separation_km: 0.1              # explicit same-band targets closer than this -> SEPARATION (03 §4)
  # game mode (docs/game-mode.md, L54)
  game_catch_km: 0.15             # flown tracking drone this close to the suspect = caught by you
  game_fly_sim_min_per_s: 0.1     # clock rate while the player flies (a 20-30 s real chase)
  game_score:                     # out of 100
    weights: {response: 20, approval: 20, rules: 20, catch: 30, coverage: 10}
    ranks: {Commander: 80, Officer: 50, Rookie: 0}   # lowest score for each rank
  game_clock:
    prompt_timeout_s: 20          # real seconds, then the safe default is picked ("timed out")
    fly_idle_s: 20                # real seconds without fly input, then the drone holds
    beat_lead_min: 2              # runs at normal rate this close to a beat, auto-skips otherwise
    jump_lead_min: 1              # START jumps to this long before the first alert
    agent_hold_s: 8               # agents never hold the game clock longer than this
  ready_floor: 3                  # L12: policy launches never take READY drones below this
  fleet_status_every_min: 30      # Fleet posts one 🔋 status this often, shift start included
  intrusion_hold_min: 5           # unauthorised drone: SEPARATION hold in its sector this long (triggers.yaml)
  search_pair_offset_km: 0.3      # missing-person search pair: targets this far west/east of the point
  incident_priority: {robbery: 1, fire: 1, missing_person: 1, accident: 2, flood: 2, default: 3}

patrol_loops:                     # rush-hour patrol plan (approved as Tasks at the brief)
  # sectors: extra sectors whose grounding grounds the loop (the centre's sector always does)
  # pilot_prefer: duty pilots tried first for this loop's rotations (then any duty pilot with capacity)
  NORTH:   {center: [3.0, 5.0], junctions: [J1, J2, J3, J4], sector: north, sectors: [NW, NE], pilot_prefer: [DP-1, DP-2]}
  CENTRAL: {center: [3.0, 3.0], junctions: [J5, J6, J7, J8], pilot_prefer: [DP-1, DP-2]}
  SOUTH:   {center: [3.0, 1.0], junctions: [J9, J10, J11, J12], pilot_prefer: [DP-2]}

pilots:                           # every airborne drone has a named supervising pilot, max 4 each (current FAA waiver practice: 1 pilot : 4 drones)
  kazum: {kind: human, roles: [watch_commander, remote_pilot, field_officer], max_drones: 4}
  DP-1:  {kind: simulated, name: "Asha Menon (duty pilot, simulated)", max_drones: 4}
  DP-2:  {kind: simulated, name: "Tom Okoye (duty pilot, simulated)", max_drones: 4}
  # max airborne = 4 x pilots on shift = 12. No unlimited "auto pool".

ground_units:
  patrol_cars: 10
  ambulances: 3
  fire_engines: 2
  road_speed_km_per_min: 0.5      # ~30 km/h rush hour, Manhattan distance
  base: [0.5, 5.5]                # station (north-west)
  dispatch_delay_min: 1           # task -> wheels rolling (ETA = 1 + Manhattan / road speed)
  start:                          # beat positions at shift start; units return here when cleared
    patrol_car_1: [0.75, 5.0]     # J1
    patrol_car_2: [2.25, 3.0]     # J6 (nearest car to Ring Road J9: 2.75 km Manhattan)
    patrol_car_3: [3.75, 5.0]     # J3
    patrol_car_4: [5.25, 5.0]     # J4
    patrol_car_5: [3.75, 3.0]     # J7 (Central Market beat)
    patrol_car_6: [5.25, 3.0]     # J8
    patrol_car_7: [4.5, 2.25]
    patrol_car_8: [5.25, 1.0]     # J12
    patrol_car_9: [4.5, 4.0]
    patrol_car_10: [0.5, 5.5]     # station
    ambulance_1: [2.1, 4.0]       # hospital
    ambulance_2: [5.0, 2.0]
    ambulance_3: [0.5, 5.5]       # station
    fire_engine_1: [0.5, 5.5]     # station
    fire_engine_2: [3.0, 2.0]
  on_scene_min: {accident: 23, robbery: 25, fire: 40, missing_person: 30, flood: 30, default: 20}
  dispatch:                       # baseline (no network): per call, nearest available unit of each kind
    accident: [patrol_car, ambulance]
    robbery: [patrol_car, patrol_car]
    fire: [fire_engine, patrol_car]
    missing_person: [patrol_car, patrol_car]
    flood: [patrol_car]
    default: [patrol_car]

baseline:                         # "the same Friday, no network": patrol cars + ONE van drone team
  van_team_base: [0.5, 5.5]
  van_setup_min: 3
  van_drone_flight_min: 40
  van_drone_charge_min: 27
  # literals of the checker's baseline arithmetic (tools/fleet_check.py keeps its own copies, L6/L35)
  van_park: [3.75, 3.0]           # van parked at J7 flying the central loop with battery swaps
  pack_up_min: 5                  # pack the van drone before driving to a call
  van_on_scene_min: {accident: 23}  # van stays until the accident clears; other kinds: 0 (no pack-up)
  suspect_kinds: [robbery]        # calls where the van searches for a fleeing suspect
  search_km: 0.5                  # suspect lost if farther than this from the alert point at van eyes-on
  swap_every_min: 30              # battery swap cadence: 180-min shift -> 6 swaps
  swap_min: 5                     # minutes off-loop per swap (checker: 6 x 5)
  weather_min: scenario           # off-loop for weather = sum of the scenario's grounding windows (FRIDAY-RUSH 30)

city:                             # city mode (docs/city-mode.md, L56). Times in sim-min; 0.5 sim-min = 1 real s
  seed: CITY-01
  day: Monday
  start: "09:00"
  sim_min_per_s: 0.5              # fixed rate, no controls
  stations:                       # road: where vehicles park, on the road grid. at: the building
    fire:
      name: Fire Station
      at: [0.45, 2.0]
      road: [0.75, 2.0]
      vehicles: {fire_engine_1: fire_engine, fire_engine_2: fire_engine}
    hospital:
      name: Hospital
      at: [4.5, 5.3]
      road: [4.5, 5.0]
      vehicles: {ambulance_1: ambulance, ambulance_2: ambulance}
    police:
      name: Police Station
      at: [3.0, 3.25]
      road: [3.0, 3.0]
      vehicles: {police_car_1: police_car, police_car_2: police_car}
  scenes:                         # on a road, west of the airfield, outside every zone
    fire:
      - {name: "Mill Lane shops", at: [2.25, 2.0]}
      - {name: "Market Street", at: [4.5, 3.0]}
      - {name: "South Depot", at: [3.0, 1.0]}
      - {name: "Northgate Flats", at: [3.75, 4.0]}
    accident:
      - {name: "Ring Road", at: [1.5, 1.0]}
      - {name: "East Avenue", at: [5.25, 2.0]}
      - {name: "North Road", at: [3.0, 5.0]}
      - {name: "Central Crossing", at: [1.5, 3.0]}
  services:                       # who goes first; `injuries` is added if the assessment finds any
    fire: [fire_engine]
    accident: [police_car]
    injuries: [ambulance]
  work_min:                       # 30-45 real seconds at sim_min_per_s
    fire_engine: {label: Extinguishing, min: 20}
    police_car: {label: "Clearing the road", min: 18}
    ambulance: {label: "Treating patients", min: 16}
  risk_chance: {fire: 0.5, accident: 0.25}  # incident flagged at risk when it starts
  injury_chance: {accident: 0.7, fire: 0.3}  # assessed once drone and first crew are on scene
  injuries_max: 3
  flare_chance: 0.6               # leaving an at-risk scene
  flare_delay_min: 3
  stay_min: 15                    # 30 real s
  decision_timeout_min: 12.5      # 25 real s, then the drone stays (safe default)
  # ambulance escort (L61). An accident with injuries, once the ambulance is on scene
  transport_chance: 0.75          # the assessment recommends the hospital over treating on scene
  stabilise_min: 8                # before leaving; treating on scene takes work_min.ambulance
  traffic_chance: 0.6             # a junction on the way to the hospital is blocked
  traffic_clear_min: 8            # a police car clearing it
  traffic_natural_clear_min: 20   # what waiting for traffic to clear by itself would cost
  traffic_sight_km: 0.4           # the escort drone sees the block from here
  traffic_stop_km: 0.15           # the ambulance stops this far short of the junction
  escort_lead_km: 0.2             # the drone flies this far ahead along the ambulance's route
  escort_handoff_km: 0.3          # a relief this close takes over the escort
  detect:                         # random fire found by a roaming drone's thermal sensor (simulated, L62)
    sense_km: 0.8                 # confidence = 100 x (1 - distance / sense_km)
    possible_pct: 40              # "possible heat source": the drone diverts toward it
    confirm_pct: 85               # "fire confirmed": the fire incident starts
    fallback_min: 4               # nobody sensed it: the nearest roamer is routed past it
    spot_step_km: 0.25            # hidden spots are on the road grid at this spacing
    clear_km: 0.4                 # ...at least this far from stations, zones and fixed scenes
  feed_lines: 6
  events_kept: 40
  start_battery: [100, 96, 92, 88, 84, 80]  # by route, so reliefs don't all fall due together
  home_pct: 35                    # no relief came: head home now, well above the safety RTB
  fleet_board_min: 60             # #fleet board every 60 sim-min = 2 real minutes (L64)
  fleet_log_min: 5                # #fleet live log: changes gathered every 5 sim-min = 10 real s (L66)
  watch_min: 60                   # `watch <place>` default: 60 clock-min = 2 real minutes (L67)
  watch_max_min: 120              # longest watch a person can ask for
  watch_km: 0.3                   # radius of the loops over the watched place
  roam:                           # closed routes of junctions: whole district, clear of RED-AIRFIELD
    - [J1, J2, J6, J5]
    - [J2, J3, J7, J6]
    - [J3, J4, J8, J7]
    - [J5, J6, J10, J9]
    - [J6, J7, J11, J10]
    - [J7, J8, J12, J11]
