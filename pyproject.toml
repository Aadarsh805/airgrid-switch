[project]
name = "airgrid"
version = "0.1.0"
description = "AirGrid: city drone response network simulator (fictional Northgate District, simulated)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.scripts]
airgrid = "cli.airgrid:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "cli", "worldbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not agents'"
markers = ["agents: headless runtime-agent tests (cost tokens; run with -m agents)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ is the canonical reference model (L6); never reformatted (L27)
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
